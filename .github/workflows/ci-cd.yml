name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  core-service-test:
    name: payment-core-service tests
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: banking
          MYSQL_USER: banking
          MYSQL_PASSWORD: bankingpass
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost -uroot -prootpassword"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Run tests
        working-directory: payment-core-service
        env:
          DB_HOST: localhost
          DB_PORT: 3306
          DB_NAME: banking
          DB_USERNAME: banking
          DB_PASSWORD: bankingpass
        run: mvn -B test

  gateway-service-test:
    name: gateway-service tests
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: banking
          MYSQL_USER: banking
          MYSQL_PASSWORD: bankingpass
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost -uroot -prootpassword"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Apply payment-core-service schema migrations
        working-directory: payment-core-service
        run: mvn -B liquibase:update
      - name: Run tests
        working-directory: gateway-service
        env:
          DB_HOST: localhost
          DB_PORT: 3306
          DB_NAME: banking
          DB_USERNAME: banking
          DB_PASSWORD: bankingpass
        run: mvn -B test

  frontend-build:
    name: frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Build
        working-directory: frontend
        run: npm run build
