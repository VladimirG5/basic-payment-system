name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  core-service-test:
    name: payment-core-service tests
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: banking
          MYSQL_USER: banking
          MYSQL_PASSWORD: bankingpass
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost -uroot -prootpassword"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Run tests
        working-directory: payment-core-service
        env:
          DB_HOST: localhost
          DB_PORT: 3306
          DB_NAME: banking
          DB_USERNAME: banking
          DB_PASSWORD: bankingpass
        run: mvn -B test

  gateway-service-test:
    name: gateway-service tests
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: banking
          MYSQL_USER: banking
          MYSQL_PASSWORD: bankingpass
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost -uroot -prootpassword"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Apply payment-core-service schema migrations
        working-directory: payment-core-service
        run: mvn -B liquibase:update
      - name: Run tests
        working-directory: gateway-service
        env:
          DB_HOST: localhost
          DB_PORT: 3306
          DB_NAME: banking
          DB_USERNAME: banking
          DB_PASSWORD: bankingpass
        run: mvn -B test

  auth-service-test:
    name: auth-service tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Run tests
        working-directory: auth-service
        run: mvn -B test

  frontend-build:
    name: frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Run tests
        working-directory: frontend
        run: npm test
      - name: Build
        working-directory: frontend
        run: npm run build

  docker-build:
    name: Docker image builds
    runs-on: ubuntu-latest
    needs: [core-service-test, gateway-service-test, auth-service-test, frontend-build]
    steps:
      - uses: actions/checkout@v4
      - name: Build payment-core-service image
        run: docker build -t basic-payment-system-payment-core-service:ci ./payment-core-service
      - name: Build auth-service image
        run: docker build -t basic-payment-system-auth-service:ci ./auth-service
      - name: Build gateway-service image
        run: docker build -t basic-payment-system-gateway-service:ci ./gateway-service
      - name: Build frontend image
        run: docker build -t basic-payment-system-frontend:ci ./frontend

  smoke-test:
    name: docker-compose smoke test
    runs-on: ubuntu-latest
    needs: docker-build
    steps:
      - uses: actions/checkout@v4
      - name: Build and start the full stack
        run: docker compose up -d --build
      - name: Wait for all services to report healthy
        run: |
          for i in $(seq 1 30); do
            statuses=$(docker compose ps --format '{{.Health}}')
            total=$(echo "$statuses" | grep -c .)
            healthy=$(echo "$statuses" | grep -c '^healthy$' || true)
            echo "healthy: $healthy/$total (attempt $i/30)"
            if [ "$total" -gt 0 ] && [ "$healthy" -eq "$total" ]; then
              echo "All services healthy"
              exit 0
            fi
            sleep 5
          done
          echo "Timed out waiting for services to become healthy"
          docker compose ps
          docker compose logs
          exit 1
      - name: Hit payment-core-service health endpoint
        run: curl -sf http://localhost:8081/actuator/health
      - name: Hit auth-service health endpoint
        run: curl -sf http://localhost:8082/actuator/health
      - name: Hit gateway-service health endpoint
        run: curl -sf http://localhost:8080/actuator/health
      - name: Hit frontend root route
        run: curl -sf http://localhost:3000/
      - name: Dump logs on failure
        if: failure()
        run: docker compose logs
      - name: Tear down
        if: always()
        run: docker compose down -v
