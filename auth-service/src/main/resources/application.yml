server:
  port: 8082

spring:
  application:
    name: auth-service

jwt:
  secret: ${JWT_SECRET:dev-only-signing-key-change-me-before-any-real-deploy-32b}
  expiration-seconds: 3600

payment-core:
  base-url: ${PAYMENT_CORE_BASE_URL:http://localhost:8081}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
