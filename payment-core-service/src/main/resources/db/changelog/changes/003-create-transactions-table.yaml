databaseChangeLog:
  - changeSet:
      id: 003-create-transactions-table
      author: vladimir
      comment: Immutable ledger - rows are inserted only, never updated. No updated_at column by design.
      changes:
        - createTable:
            tableName: transactions
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: source_account_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: destination_account_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: amount
                  type: DECIMAL(19, 4)
                  constraints:
                    nullable: false
              - column:
                  name: currency
                  type: VARCHAR(3)
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: reference_note
                  type: VARCHAR(255)
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: transactions
            baseColumnNames: source_account_id
            constraintName: fk_transactions_source_account
            referencedTableName: accounts
            referencedColumnNames: id
        - addForeignKeyConstraint:
            baseTableName: transactions
            baseColumnNames: destination_account_id
            constraintName: fk_transactions_destination_account
            referencedTableName: accounts
            referencedColumnNames: id
        - createIndex:
            indexName: idx_transactions_source_account_id
            tableName: transactions
            columns:
              - column:
                  name: source_account_id
        - createIndex:
            indexName: idx_transactions_destination_account_id
            tableName: transactions
            columns:
              - column:
                  name: destination_account_id
