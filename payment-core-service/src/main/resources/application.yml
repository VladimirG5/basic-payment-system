server:
  port: 8081

spring:
  application:
    name: payment-core-service
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:banking}
    username: ${DB_USERNAME:banking}
    password: ${DB_PASSWORD:bankingpass}
    driver-class-name: com.mysql.cj.jdbc.Driver
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

# Dev-only key committed for local/demo compose - not a real secret (same disclaimer as
# gateway-service's jwt.secret). Must match gateway-service's encryption.key exactly - both
# services decrypt the same `full_name` column, see EncryptedStringConverter.
encryption:
  key: ${ENCRYPTION_KEY:mzD/i0fiHcYLv3g0wwTlvAp49wYo1MFNRYBM/f52XPI=}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
