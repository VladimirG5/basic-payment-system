server:
  port: 8080

spring:
  application:
    name: gateway-service
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:banking}
    username: ${DB_USERNAME:banking}
    password: ${DB_PASSWORD:bankingpass}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

jwt:
  secret: ${JWT_SECRET:dev-only-signing-key-change-me-before-any-real-deploy-32b}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

payment-core:
  base-url: ${PAYMENT_CORE_BASE_URL:http://localhost:8081}

auth-service:
  base-url: ${AUTH_SERVICE_BASE_URL:http://localhost:8082}

# Dev-only key committed for local/demo compose - not a real secret. Must match
# payment-core-service's encryption.key exactly - see EncryptedStringConverter.
encryption:
  key: ${ENCRYPTION_KEY:mzD/i0fiHcYLv3g0wwTlvAp49wYo1MFNRYBM/f52XPI=}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
