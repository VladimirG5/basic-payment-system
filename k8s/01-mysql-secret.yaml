apiVersion: v1
kind: Secret
metadata:
  name: mysql-secret
  namespace: banking
type: Opaque
stringData:
  # Same values as docker-compose.yml's mysql service - fine to commit for a local/demo
  # cluster, not a real secret.
  mysql-root-password: rootpassword
  mysql-database: banking
  mysql-user: banking
  mysql-password: bankingpass
