apiVersion: v1
kind: Secret
metadata:
  name: jwt-secret
  namespace: banking
type: Opaque
stringData:
  # Dev-only signing key - not a real secret, same value used in docker-compose.yml.
  # auth-service issues tokens with this; gateway-service validates them with the same key.
  jwt-secret: dev-only-signing-key-change-me-before-any-real-deploy-32b
