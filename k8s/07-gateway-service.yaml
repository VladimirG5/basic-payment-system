apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-service
  namespace: banking
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway-service
  template:
    metadata:
      labels:
        app: gateway-service
    spec:
      containers:
        - name: gateway-service
          image: gateway-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            - name: DB_HOST
              value: mysql
            - name: DB_PORT
              value: "3306"
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: mysql-database
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: mysql-user
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: mysql-password
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: jwt-secret
                  key: jwt-secret
            - name: ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: encryption-secret
                  key: encryption-key
            - name: PAYMENT_CORE_BASE_URL
              value: http://payment-core-service:8081
            - name: AUTH_SERVICE_BASE_URL
              value: http://auth-service:8082
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 15
---
# The public edge - NodePort so it's reachable from outside the cluster without an Ingress
# controller, same rationale as frontend's Service below.
apiVersion: v1
kind: Service
metadata:
  name: gateway-service
  namespace: banking
spec:
  type: NodePort
  selector:
    app: gateway-service
  ports:
    - port: 8080
      nodePort: 30081
