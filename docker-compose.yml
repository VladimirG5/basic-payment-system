services:
  mysql:
    image: mysql:8.0
    container_name: banking-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: banking
      MYSQL_USER: banking
      MYSQL_PASSWORD: bankingpass
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  payment-core-service:
    build:
      context: ./payment-core-service
    container_name: payment-core-service
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: banking
      DB_USERNAME: banking
      DB_PASSWORD: bankingpass
    ports:
      - "8081:8081"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  gateway-service:
    build:
      context: ./gateway-service
    container_name: gateway-service
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: banking
      DB_USERNAME: banking
      DB_PASSWORD: bankingpass
      # Dev-only signing key committed for local/demo compose - not a real secret.
      JWT_SECRET: dev-only-signing-key-change-me-before-any-real-deploy-32b
    ports:
      - "8080:8080"
    depends_on:
      payment-core-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  mysql-data:
