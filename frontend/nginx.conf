server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # react-router uses client-side routing (/login, /register, /) - without
    # this fallback, a direct navigation or refresh on those paths 404s since
    # nginx would otherwise look for a matching file/directory on disk.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
